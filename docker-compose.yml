# 플랫폼 로컬 인프라(계획 0단계). docker compose up -d
# 호스트의 원천 방출기는 localhost:9092로 보낸다: uv run python -m emitter --sink kafka
# 컨테이너끼리는 redpanda:29092, Console은 http://localhost:8081, Airflow는 http://localhost:8080

# Airflow 3, LocalExecutor + Postgres. 공식 compose에서 Celery·Redis·triggerer를 뺐다.
# 로그인 없이 모두 관리자(SimpleAuthManager): 노트북 한 대의 개발용이다.
x-airflow: &airflow
  image: apache/airflow:3.3.2-python3.12
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: local-dev-only
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/data
    - ./requests:/requests
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 10s
      retries: 20

  # 토픽 자동 생성을 끄고 토픽·파티션·보존 기간을 맞춘 뒤 끝난다. 이미 있으면 설정만 다시 맞춘다
  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    environment:
      RPK_BROKERS: redpanda:29092
      RPK_ADMIN_HOSTS: redpanda:9644
    volumes:
      - ./scripts/create_topics.sh:/scripts/create_topics.sh:ro
    depends_on:
      redpanda:
        condition: service_healthy

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8081:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    command: ["db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    restart: unless-stopped

volumes:
  redpanda:
  postgres:
  airflow-logs:
