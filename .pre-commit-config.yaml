# 커밋 전에 ruff로 고치고 검사한다. 설치: uv run pre-commit install
# ruff는 uv.lock의 버전을 쓴다(CI와 같은 버전). 그래서 원격 hook 저장소 대신 local hook이다.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
